version: "3"

services:
  test:
    build: 
      context: ./bin/${PHPVERSION}
    container_name: test
    restart: 'always'
    #userns_mode: keep-id:uid=1000
    #userns_mode: keep-id:uid=1000
    ports:
      - 4080:80
      - 4443:443
    links: 
      - database
    volumes: 
      - /home/liuai/claroline/src/test:/var/www/html:rw
      - ${PHP_INI-./config/php/php.ini}:/usr/local/etc/php/php.ini
      - ${VHOSTS_DIR-./config/vhosts}:/etc/apache2/sites-enabled
      - ${LOG_DIR-./logs/apache2}:/var/log/apache2
      - ${XDEBUG_LOG_DIR-./logs/xdebug}:/var/log/xdebug
    environment:
      APACHE_DOCUMENT_ROOT: ${APACHE_DOCUMENT_ROOT-/var/www/html/public}
      PMA_PORT: ${HOST_MACHINE_PMA_PORT}
      PMA_SECURE_PORT: ${HOST_MACHINE_PMA_SECURE_PORT}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      HOST_MACHINE_MYSQL_PORT: ${HOST_MACHINE_MYSQL_PORT}
      XDEBUG_CONFIG: "client_host=host.containers.internal remote_port=${XDEBUG_PORT}"
    extra_hosts:
      - "host.containers.internal:host-gateway"
      - "localhost:127.0.0.1"
      - "dash.localhost:127.0.0.1"
      - "projects.localhost:127.0.0.1"
      - "app.localhost:127.0.0.1"
      - "claroline.localhost:127.0.0.1"
    # 容器保持 root 运行:entrypoint 需要 root 做 var/ 权限修复,
    # apache2-foreground 内部会自动降权到 www-data(uid 1000)处理请求
    # user: ${UID:-1000}:${GID:-1000}
  webserver:
    build: 
      context: ./bin/${PHPVERSION}
    container_name: '${COMPOSE_PROJECT_NAME}-${PHPVERSION}'
    restart: 'always'
    #userns_mode: keep-id:uid=1000
    #userns_mode: keep-id:uid=1000
    ports:
      - "${HOST_MACHINE_UNSECURE_HOST_PORT}:80"
      - "${HOST_MACHINE_SECURE_HOST_PORT}:443"
    links: 
      - database
    volumes: 
      - ${DOCUMENT_ROOT-/home/liu-ai/dev/Claroline}:/var/www/html:rw
      - ${PHP_INI-./config/php/php.ini}:/usr/local/etc/php/php.ini
      - ${VHOSTS_DIR-./config/vhosts}:/etc/apache2/sites-enabled
      - ${LOG_DIR-./logs/apache2}:/var/log/apache2
      - ${XDEBUG_LOG_DIR-./logs/xdebug}:/var/log/xdebug
    environment:
      APACHE_DOCUMENT_ROOT: ${APACHE_DOCUMENT_ROOT-/var/www/html/public}
      PMA_PORT: ${HOST_MACHINE_PMA_PORT}
      PMA_SECURE_PORT: ${HOST_MACHINE_PMA_SECURE_PORT}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      HOST_MACHINE_MYSQL_PORT: ${HOST_MACHINE_MYSQL_PORT}
      XDEBUG_CONFIG: "client_host=host.containers.internal remote_port=${XDEBUG_PORT}"
    extra_hosts:
      - "host.containers.internal:host-gateway"
      - "localhost:127.0.0.1"
      - "dash.localhost:127.0.0.1"
      - "projects.localhost:127.0.0.1"
      - "app.localhost:127.0.0.1"
      - "claroline.localhost:127.0.0.1"
    # 容器保持 root 运行:entrypoint 需要 root 做 var/ 权限修复,
    # apache2-foreground 内部会自动降权到 www-data(uid 1000)处理请求
    # user: ${UID:-1000}:${GID:-1000}
  database:
    build:
      context: "./bin/${DATABASE}"
    container_name: '${COMPOSE_PROJECT_NAME}-${DATABASE}'
    restart: 'always'
    ports:
      - "127.0.0.1:${HOST_MACHINE_MYSQL_PORT}:3306"
    volumes: 
      - ${MYSQL_INITDB_DIR-./config/initdb}:/docker-entrypoint-initdb.d
      - ${MYSQL_DATA_DIR-./data/mysql}:/var/lib/mysql
      - ${MYSQL_LOG_DIR-./logs/mysql}:/var/log/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
  phpmyadmin:
    build: 
      context: ./bin/phpmyadmin
    container_name: '${COMPOSE_PROJECT_NAME}-phpmyadmin'
    restart: 'always'
    links:
      - database
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      UPLOAD_LIMIT: ${UPLOAD_LIMIT}
      MEMORY_LIMIT: ${MEMORY_LIMIT}
    ports:
      - '${HOST_MACHINE_PMA_PORT}:80'
      - '${HOST_MACHINE_PMA_SECURE_PORT}:443'
    volumes: 
      - /sessions
      - ${PHP_INI-./config/php/php.ini}:/usr/local/etc/php/conf.d/php-phpmyadmin.ini
  # ai-avatar-bot：Live2D 语音虚拟人组件（静态前端，build 自 src/ai-avatar-bot）
  ai-avatar-bot:
    build:
      context: ../src/ai-avatar-bot
      dockerfile: Dockerfile
    container_name: '${COMPOSE_PROJECT_NAME}-ai-avatar-bot'
    restart: 'always'
    # 通过 nginx 代理访问，不直接暴露宿主机端口。
    # 自备 Live2D 模型（haru 已下载到 models/），data-model 指向 /models/haru/haru_greeter_t03.model3.json：
    volumes:
      - ../src/ai-avatar-bot/models:/usr/share/nginx/html/models:ro
  # edge-tts：微软 Edge 免费神经语音合成（大陆可达），供数字老师 TTS 使用
  edge-tts:
    build:
      context: ../src/edge-tts
      dockerfile: Dockerfile
    container_name: '${COMPOSE_PROJECT_NAME}-edge-tts'
    restart: 'always'
  # nginx：ai-avatar-bot 的反向代理统一入口（未来可加 auth_request 鉴权）
  nginx:
    image: nginx:1.27-alpine
    container_name: '${COMPOSE_PROJECT_NAME}-nginx'
    restart: 'always'
    ports:
      - "${HOST_MACHINE_AVATAR_PORT:-8081}:80"
    volumes:
      - ./config/nginx:/etc/nginx/conf.d:ro
    depends_on:
      - ai-avatar-bot
