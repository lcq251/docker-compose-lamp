<VirtualHost *:80>
    ServerAdmin webmaster@claroline.localhost
    DocumentRoot ${APACHE_DOCUMENT_ROOT}
    ServerName claroline.localhost:80
    <Directory ${APACHE_DOCUMENT_ROOT}>
        AllowOverride All
        Options +FollowSymLinks -Indexes
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:443>
    ServerAdmin webmaster@claroline.localhost
    DocumentRoot ${APACHE_DOCUMENT_ROOT}
    ServerName claroline.localhost:443
    SSLEngine on
    SSLCertificateFile "/etc/apache2/ssl/ssl.crt"
    SSLCertificateKeyFile "/etc/apache2/ssl/ssl.key"
    <Directory ${APACHE_DOCUMENT_ROOT}>
        AllowOverride All
        Options +FollowSymLinks -Indexes
        Require all granted
    </Directory>
</VirtualHost>
