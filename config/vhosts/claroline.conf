<VirtualHost *:80>
    ServerAdmin webmaster@claroline.localhost
    DocumentRoot ${APACHE_DOCUMENT_ROOT}
    ServerName claroline.localhost:80

    # 同域反代：/avatar/ → ai-avatar-bot（数字人静态资源，session cookie 同域透传）
    <IfModule mod_proxy.c>
        ProxyPreserveHost On
        ProxyPass /avatar/ http://ai-avatar-bot/
        ProxyPassReverse /avatar/ http://ai-avatar-bot/
        # 数字人渲染库 + 模型文件也反代（widget.html 内引用的是根路径 /vendor/、/models/）
        ProxyPass /vendor/ http://ai-avatar-bot/vendor/
        ProxyPassReverse /vendor/ http://ai-avatar-bot/vendor/
        ProxyPass /models/ http://ai-avatar-bot/models/
        ProxyPassReverse /models/ http://ai-avatar-bot/models/
    </IfModule>

    <Directory ${APACHE_DOCUMENT_ROOT}>
        AllowOverride All
        Options +FollowSymLinks -Indexes
        Require all granted

        <IfModule mod_rewrite.c>
            Options -MultiViews
            RewriteEngine On
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteRule ^(.*)$ index.php [QSA,L]
        </IfModule>
    </Directory>
</VirtualHost>

<VirtualHost *:443>
    ServerAdmin webmaster@claroline.localhost
    DocumentRoot ${APACHE_DOCUMENT_ROOT}
    ServerName claroline.localhost:443
    SSLEngine on
    SSLCertificateFile "/etc/apache2/ssl/ssl.crt"
    SSLCertificateKeyFile "/etc/apache2/ssl/ssl.key"

    # 同域反代：/avatar/ → ai-avatar-bot
    <IfModule mod_proxy.c>
        ProxyPreserveHost On
        ProxyPass /avatar/ http://ai-avatar-bot/
        ProxyPassReverse /avatar/ http://ai-avatar-bot/
        # 数字人渲染库 + 模型文件也反代（widget.html 内引用的是根路径 /vendor/、/models/）
        ProxyPass /vendor/ http://ai-avatar-bot/vendor/
        ProxyPassReverse /vendor/ http://ai-avatar-bot/vendor/
        ProxyPass /models/ http://ai-avatar-bot/models/
        ProxyPassReverse /models/ http://ai-avatar-bot/models/
    </IfModule>

     <Directory ${APACHE_DOCUMENT_ROOT}>
        AllowOverride All
        Options +FollowSymLinks -Indexes
        Require all granted

        <IfModule mod_rewrite.c>
            Options -MultiViews
            RewriteEngine On
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteRule ^(.*)$ index.php [QSA,L]
        </IfModule>
    </Directory>
</VirtualHost>
