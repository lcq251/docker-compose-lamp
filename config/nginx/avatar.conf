# ai-avatar-bot 反向代理
# 对外统一入口：将 Live2D 语音虚拟人组件（embed.js / widget.html / 渲染库）代理出来。
# 未来可在此加 auth_request 鉴权（sidecar 模式，参考 claroline-fay-nginx-sidecar）。

server {
    listen 80;
    server_name _;

    # 代理到 ai-avatar-bot 容器（默认网络内 service 名可解析）
    location / {
        proxy_pass http://ai-avatar-bot:80;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / SSE 支持（语音流式交互预留）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 长连接与超时（SSE 流式回答）
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
