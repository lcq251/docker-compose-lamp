memory_limit = 4G
post_max_size = 20M
upload_max_filesize = 20M

# Xdebug 2
#xdebug.remote_enable=1
#xdebug.remote_autostart=1
#xdebug.remote_connect_back=1
#xdebug.remote_host=host.docker.internal
#xdebug.remote_port=9000

# Xdebug 3
#xdebug.mode=debug
#xdebug.start_with_request=yes
#xdebug.client_host=host.docker.internal
#xdebug.client_port=9003
#xdebug.idekey=VSCODE

; 2026-08-03: disable xdebug in web SAPI (was loading in 'develop' mode,
; adding per-request overhead). Re-enable for debugging by uncommenting
; xdebug.mode=debug below (and remove the =off line).
xdebug.mode=off

; 2026-08-15: production hardening — PHP warnings/notices were being written
; straight into HTTP response bodies (display_errors default On), corrupting JSON
; API responses (e.g. resource creation 500 returned JSON+warning+HTML concat,
; breaking frontend JSON.parse). Route errors to log instead.
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED